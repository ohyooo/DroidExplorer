name: CI

on: [push, pull_request]

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :protocol:test \
            :client-core:test \
            :transport-adb:test \
            :server-android:bundleRelease

      - name: Generate four signed ABI APKs from AAB
        shell: bash
        run: |
          bash .github/scripts/build-abi-apks.sh server-android DroidExplorer

      - name: Upload arm64-v8a APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/DroidExplorer-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload armeabi-v7a APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/DroidExplorer-armeabi-v7a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86 APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/DroidExplorer-x86.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload x86_64 APK without ZIP wrapping
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/DroidExplorer-x86_64.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload retrace mapping without ZIP wrapping
        if: ${{ hashFiles('ci-output/abi-apks/DroidExplorer-mapping.txt') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: ci-output/abi-apks/DroidExplorer-mapping.txt
          archive: false
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-latest
    env:
      CMAKE_EXE: cmake
      NINJA_EXE: ninja

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: .\gradlew.bat build packageRelease

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            **/build/**/*.exe
            **/build/**/*.msi
            **/build/**/*.zip
          retention-days: 7
